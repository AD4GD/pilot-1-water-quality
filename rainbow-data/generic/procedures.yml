  ISO_6878-2004:
    label: International standard ISO 6878:2004, Published (Edition 2, 2004)
    description: ISO 6878:2004 specifies methods for the determination of orthophosphate, orthophosphate after solvent extraction, hydrolysable phosphate plus orthophosphate, and total phosphorus after decomposition.The methods are applicable to all kinds of water including seawater and effluents. Phosphorus concentrations within the range of 0,005 mg/l to 0,8 mg/l may be determined in such samples without dilution. A solvent extraction procedure allows smaller phosphorus concentrations to be determined with a detection limit of about 0,000 5 mg/l.
    sources:
      - label: AD4GD
        url: https://ad4gd.eu/
    seeAlso:
      - https://www.iso.org/standard/36917.html
    sameAs:
      - https://dx.doi.org/10.31030/9552789
    hasBroader:
      - orthophosphate-measurement

  Easy_Life_PO4:
    label: Easy Life PO4 Phosphate Test Kit Water Quality Tests
    description: |-
      A simple Ortho-phosphate measurement based on colour reactions. No further equipment needed. The semi-quantitative result is a classification of ortho-phosphate concentration in one of 9 classes (values in mg/L): "0", "0.02", "0.05", "0.1", "0.2", "0.5", "1", "1.5", "2"
    sources:
      - label: Easy Life International B.V.
        url: https://www.easylife.eu/
    seeAlso:
      - https://www.easylife.eu/products/freshwater/water-tests/phosphate
    hasBroader:
      - orthophosphate-measurement

  JBL_NH4:
    label: JBL Pro Aquatest NH4 Water Analysis
    descpription: |-
      A simple ammonimum measurement based on color reaction. No further equipment needed. The semi-quantitative result is a classification of ammonium concentration in one the 9 classes (values in mg/L): "<0,05", "0,1", "0,2", "0,4", "0,6", "1", "1,5", "3", "5"
    sources:
